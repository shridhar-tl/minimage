name: Build & Release

# Manual trigger. Choose which OSes to build — only the selected ones run.
on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Build Windows (.exe / .msi / .msix)'
        type: boolean
        default: true
      macos:
        description: 'Build macOS (.dmg)'
        type: boolean
        default: false
      linux:
        description: 'Build Linux (.deb / .AppImage)'
        type: boolean
        default: false
      version:
        description: 'Version (e.g. 0.1.0). Blank = use tauri.conf.json.'
        type: string
        default: ''
      release:
        description: 'Publish a GitHub Release (otherwise just upload artifacts)'
        type: boolean
        default: false
      store:
        description: 'Publish the MSIX to Microsoft Store (free apps only; needs Partner Center secrets + existing listing — see notes below). The MSIX is built regardless; this only controls auto-submit.'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Build the job matrix from the selected OS checkboxes.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      any: ${{ steps.set.outputs.any }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: set
        shell: bash
        run: |
          include='[]'
          add() { include=$(echo "$include" | jq -c ". += [$1]"); }
          if [ "${{ inputs.windows }}" = "true" ]; then add '{"name":"windows","runner":"windows-latest","args":"--bundles nsis,msi --features webp-lossy --target x86_64-pc-windows-msvc"}'; fi
          if [ "${{ inputs.macos }}"   = "true" ]; then add '{"name":"macos","runner":"macos-latest","args":"--bundles app,dmg --features webp-lossy"}'; fi
          if [ "${{ inputs.linux }}"   = "true" ]; then add '{"name":"linux","runner":"ubuntu-22.04","args":"--bundles deb,appimage --features webp-lossy"}'; fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          if [ "$include" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "Selected matrix: $include"

          # Compute the date-stamped release tag ONCE here so every matrix job and the
          # MSIX-attach step share an identical tag (avoids a midnight-UTC split across
          # parallel jobs). Format: v<version>_<YYYY>_<MM>_<DD>  e.g. v0.1.0_2026_05_24
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then ver=$(node -p "require('./src-tauri/tauri.conf.json').version"); fi
          tag="v${ver}_$(date -u +%Y_%m_%d)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # Create the Release ONCE here (when requested) so the parallel matrix jobs
      # can each `gh release upload` their zips into it without racing to create it.
      # tauri-action no longer creates/uploads the Release — every asset is a clean,
      # per-file zip attached by the build jobs, so the Release holds only those.
      - name: Create GitHub Release
        if: ${{ inputs.release }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.set.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — reusing it."
            exit 0
          fi
          flags=()
          [ "${{ inputs.draft }}" = "true" ]      && flags+=(--draft)
          [ "${{ inputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          gh release create "$tag" \
            --title "Minimage $tag" \
            --notes $'Minimage — batch image resizer, converter and optimizer.\nDownload the installer for your OS below.' \
            "${flags[@]}"
          echo "Created release $tag"

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: ${{ matrix.name == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
          # Don't cache ~/.cargo/bin: it's where the MSIX step installs
          # msixbundle-cli, and caching that churning dir on Windows both
          # conflicts with that install and triggers tar/zstd restore failures.
          cache-bin: false

      - name: Install frontend dependencies
        run: npm install --force

      - name: Override version (optional)
        if: ${{ inputs.version != '' }}
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version='${{ inputs.version }}';fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n');console.log('version =', j.version)"

      # Build only — no release upload. tauri-action attaches its raw installers to
      # the Release when given a tagName; we omit it so the Release carries only the
      # clean per-file zips produced below. The Release is created in `prepare`.
      - name: Build
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # Package each macOS/Linux installer as its own flat zip (no folders inside),
      # matching the Windows treatment. `zip -j` junks the source path so the zip
      # contains only the file itself. The .app is skipped — the .dmg is the macOS
      # distributable; the .app exists only to produce it.
      - name: Package macOS / Linux zips
        if: ${{ matrix.name != 'windows' }}
        shell: bash
        run: |
          shopt -s nullglob
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then ver=$(node -p "require('./src-tauri/tauri.conf.json').version"); fi
          stage="dist-unix"
          mkdir -p "$stage"
          pack() {
            local src="$1" zipname="$2"
            [ -e "$src" ] || { echo "Skipping missing $src"; return; }
            zip -j "$stage/$zipname" "$src"
            echo "Packed $src -> $zipname"
          }
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            pack "$f" "Minimage-$ver-$(basename "$f").zip"
          done
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            pack "$f" "Minimage-$ver-$(basename "$f").zip"
          done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            pack "$f" "Minimage-$ver-$(basename "$f").zip"
          done
          echo "Staged zips:"; ls -1 "$stage"

      # One artifact per installer type. The glob in each step only matches on the
      # OS that produces it (dmg→macOS, deb/appimage→Linux); the others no-op via
      # if-no-files-found: ignore. Same flat-zip guarantee as Windows.
      - name: Upload dmg artifact
        if: ${{ matrix.name == 'macos' }}
        uses: actions/upload-artifact@v7
        with:
          name: minimage-macos-dmg
          if-no-files-found: warn
          path: dist-unix/*.dmg.zip

      - name: Upload deb artifact
        if: ${{ matrix.name == 'linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: minimage-linux-deb
          if-no-files-found: warn
          path: dist-unix/*.deb.zip

      - name: Upload AppImage artifact
        if: ${{ matrix.name == 'linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: minimage-linux-appimage
          if-no-files-found: warn
          path: dist-unix/*.AppImage.zip

      - name: Attach macOS / Linux zips to GitHub Release
        if: ${{ matrix.name != 'windows' && inputs.release }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          tag="${{ needs.prepare.outputs.tag }}"
          assets=(dist-unix/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No macOS/Linux zips found in dist-unix/" >&2
            exit 1
          fi
          echo "Uploading ${#assets[@]} zip(s) to release $tag: ${assets[*]}"
          gh release upload "$tag" "${assets[@]}" --clobber

      # ── MSIX (Windows only) ──────────────────────────────────────────────────────
      # Tauri can't emit MSIX natively, so we build it with the community packager.
      # We build it UNSIGNED on purpose: the Microsoft Store re-signs the package on
      # submission, so no code-signing certificate/secret is needed for the Store path.
      # The .msix is always produced (artifact + optional Release asset); auto-submit
      # to the Store is a separate, checkbox-gated job below.
      # Install the MSIX packer as a PREBUILT binary (cargo-binstall) instead of
      # `cargo install`, which compiles it from source (~minutes) on every run.
      - name: Install cargo-binstall
        if: ${{ matrix.name == 'windows' }}
        uses: cargo-bins/cargo-binstall@main

      - name: Install msixbundle-cli
        if: ${{ matrix.name == 'windows' }}
        run: cargo binstall -y msixbundle-cli

      # `build` needs gen/windows/AppxManifest.xml.template and gen/windows/Assets/,
      # which are produced by `init` — not committed (only bundle.config.json is).
      # `init` is non-interactive but UNCONDITIONALLY overwrites bundle.config.json
      # with a CN=YourCompany placeholder, so we stash our hand-maintained config
      # first and restore it afterwards, keeping the manifest + assets it generated.
      - name: Init MSIX scaffolding
        if: ${{ matrix.name == 'windows' }}
        shell: pwsh
        run: |
          $cfg = "src-tauri/gen/windows/bundle.config.json"
          $bak = "$cfg.committed"
          Copy-Item $cfg $bak -Force
          npx -y @choochmeque/tauri-windows-bundle@latest init
          Copy-Item $bak $cfg -Force
          Remove-Item $bak -Force
          if (-not (Test-Path "src-tauri/gen/windows/AppxManifest.xml.template")) {
            Write-Error "init did not produce AppxManifest.xml.template"; exit 1
          }
          Write-Host "MSIX scaffolding ready; committed bundle.config.json restored."

      - name: Build MSIX
        if: ${{ matrix.name == 'windows' }}
        run: npx -y @choochmeque/tauri-windows-bundle@latest build --arch x64 --runner npm

      # Raw (unzipped) MSIX, consumed only by the store-publish job below — the
      # Microsoft Store CLI needs the bare .msix/.msixbundle, not a zip. This is an
      # internal hand-off artifact; the user-facing MSIX download is the zip below.
      - name: Upload raw MSIX (for Store job)
        if: ${{ matrix.name == 'windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: minimage-msix
          if-no-files-found: error
          path: |
            src-tauri/target/msix/*.msix
            src-tauri/target/msix/*.msixbundle

      # ── Package every Windows output as a flat, single-file zip ───────────────────
      # Tauri/upload-artifact would otherwise nest each file under its deep build
      # path (…/release/bundle/msi/…). Instead we gather the four outputs into a
      # staging dir under clean versioned names, then zip EACH on its own with no
      # folder structure inside. These zips feed both the artifacts and the Release
      # so the asset you download is exactly the zip you want — nothing nested.
      #   • portable  → the standalone Minimage.exe
      #   • msi       → the .msi installer
      #   • nsis      → the NSIS setup .exe
      #   • msix      → the .msix/.msixbundle (Store package)
      - name: Package Windows zips
        if: ${{ matrix.name == 'windows' }}
        shell: pwsh
        run: |
          $ver = node -p "require('./src-tauri/tauri.conf.json').version"
          $rel = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $stage = "dist-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          function Add-Zip([string]$src, [string]$zipName) {
            if (-not $src -or -not (Test-Path $src)) {
              Write-Error "Expected file not found: $src"; exit 1
            }
            $zipPath = Join-Path $stage $zipName
            Compress-Archive -Path $src -DestinationPath $zipPath -Force
            Write-Host "Packed $src -> $zipName"
          }

          $exe  = Join-Path $rel "Minimage.exe"
          $msi  = Get-ChildItem -Path (Join-Path $rel "bundle/msi")  -Filter *.msi  -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-ChildItem -Path (Join-Path $rel "bundle/nsis") -Filter *.exe  -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $msix = Get-ChildItem -Path "src-tauri/target/msix" -Include *.msixbundle,*.msix -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          Add-Zip $exe        "Minimage-$ver-x64-portable.zip"
          Add-Zip $msi.FullName  "Minimage-$ver-x64-msi.zip"
          Add-Zip $nsis.FullName "Minimage-$ver-x64-setup.zip"
          Add-Zip $msix.FullName "Minimage-$ver-x64-msix.zip"

          Write-Host "Staged Windows zips:"
          Get-ChildItem $stage | ForEach-Object { Write-Host "  $($_.Name)" }

      # One artifact PER installer, so each downloads on its own as a flat zip
      # holding just that file. (GitHub wraps every artifact in its own outer zip
      # layer; one file per artifact keeps that single layer flat — no folders.)
      - name: Upload portable exe artifact
        if: ${{ matrix.name == 'windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: minimage-windows-portable
          if-no-files-found: error
          path: dist-windows/Minimage-*-x64-portable.zip

      - name: Upload msi artifact
        if: ${{ matrix.name == 'windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: minimage-windows-msi
          if-no-files-found: error
          path: dist-windows/Minimage-*-x64-msi.zip

      - name: Upload nsis setup artifact
        if: ${{ matrix.name == 'windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: minimage-windows-setup
          if-no-files-found: error
          path: dist-windows/Minimage-*-x64-setup.zip

      - name: Upload msix artifact
        if: ${{ matrix.name == 'windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: minimage-windows-msix
          if-no-files-found: error
          path: dist-windows/Minimage-*-x64-msix.zip

      - name: Attach Windows zips to GitHub Release
        if: ${{ matrix.name == 'windows' && inputs.release }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          tag="${{ needs.prepare.outputs.tag }}"
          assets=(dist-windows/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Windows zips found in dist-windows/" >&2
            exit 1
          fi
          echo "Uploading ${#assets[@]} Windows zip(s) to release $tag: ${assets[*]}"
          gh release upload "$tag" "${assets[@]}" --clobber

  # Publish the freshly built MSIX to the Microsoft Store.
  #
  # Runs only when the "store" checkbox is ticked AND the Windows build succeeded.
  # The MSIX itself is always built in the `build` job above and uploaded as the
  # `minimage-msix` artifact — so you can ALWAYS grab it and submit by hand. This job
  # only adds the optional AUTO-SUBMIT when the checkbox is on.
  #
  # ╔══════════════════════════════════════════════════════════════════════════════╗
  # ║ ONE-TIME SETUP — do these once, by hand, before the checkbox can publish.      ║
  # ╚══════════════════════════════════════════════════════════════════════════════╝
  #
  #  STEP 1 — Partner Center account (Microsoft Store dev account)
  #    Go to https://partner.microsoft.com/dashboard → register as an app developer.
  #    A free-app individual account is a ~$19 one-time fee.
  #
  #  STEP 2 — Create the app listing & do the FIRST submission manually
  #    In Partner Center: Create a new app, reserve its name, fill the Store listing,
  #    upload this MSIX (download it from the `minimage-msix` artifact of any build),
  #    and submit. The CLI used below can only UPDATE an app that already exists & is
  #    live — it cannot create the first submission.
  #
  #  STEP 3 — Connect Microsoft Entra (Azure AD) so CI can authenticate
  #    In Partner Center → Account settings → User management, associate an Entra
  #    tenant, register an application in it, and assign that app the "Manager" role.
  #    https://learn.microsoft.com/windows/apps/publish/msstore-dev-cli/github-actions
  #
  #  STEP 4 — Add these REPO SECRETS  (GitHub → Settings → Secrets and variables →
  #           Actions → "Secrets" tab → New repository secret). Names must match exactly:
  #
  #      ┌────────────────────────────────────┬───────────────────────────────────────┐
  #      │ Secret name (create with this name) │ Where to find the value               │
  #      ├────────────────────────────────────┼───────────────────────────────────────┤
  #      │ AZURE_AD_TENANT_ID                  │ entra.microsoft.com → Overview →        │
  #      │                                    │ "Tenant ID"                            │
  #      │ AZURE_AD_APPLICATION_CLIENT_ID      │ Entra → App registrations → your app → │
  #      │                                    │ "Application (client) ID"              │
  #      │ AZURE_AD_APPLICATION_SECRET         │ Entra → App registrations → your app → │
  #      │                                    │ Certificates & secrets → new client    │
  #      │                                    │ secret → copy the VALUE immediately    │
  #      │ SELLER_ID                          │ Partner Center → Account settings →    │
  #      │                                    │ Identifiers → "Seller ID"              │
  #      └────────────────────────────────────┴───────────────────────────────────────┘
  #
  #  STEP 5 — Add this REPO VARIABLE  (same screen → "Variables" tab → New variable):
  #
  #      ┌──────────────────┬──────────────────────────────────────────────────────────┐
  #      │ Variable name    │ Value                                                     │
  #      ├──────────────────┼──────────────────────────────────────────────────────────┤
  #      │ STORE_PRODUCT_ID │ Your app's Store/Product ID from Partner Center (the app   │
  #      │                  │ "Product ID" / Store ID on the app's overview page).       │
  #      └──────────────────┴──────────────────────────────────────────────────────────┘
  #
  #  That's it. Until all five exist, this job stops early with a friendly summary
  #  instead of erroring — so it is safe to merge and run right now.
  store-publish:
    needs: build
    if: ${{ inputs.store && inputs.windows && needs.build.result == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Check required secrets/variables
        id: gate
        shell: bash
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          missing=()
          [ -z "$TENANT_ID" ]     && missing+=("secret AZURE_AD_TENANT_ID")
          [ -z "$CLIENT_ID" ]     && missing+=("secret AZURE_AD_APPLICATION_CLIENT_ID")
          [ -z "$CLIENT_SECRET" ] && missing+=("secret AZURE_AD_APPLICATION_SECRET")
          [ -z "$SELLER_ID" ]     && missing+=("secret SELLER_ID")
          [ -z "$PRODUCT_ID" ]    && missing+=("variable STORE_PRODUCT_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            {
              echo "## ⏭️  Microsoft Store auto-publish skipped"
              echo "The MSIX was still built (see the \`minimage-msix\` artifact) — only auto-submit was skipped because credentials are not configured yet."
              echo ""
              echo "Missing:"
              for m in "${missing[@]}"; do echo "- \`$m\`"; done
              echo ""
              echo "Add them under repo Settings → Secrets and variables → Actions. Full instructions are in the comment block above \`store-publish\` in .github/workflows/build.yml."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download MSIX artifact
        if: ${{ steps.gate.outputs.ready == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: minimage-msix
          path: msix

      - name: Resolve MSIX path
        id: pkg
        if: ${{ steps.gate.outputs.ready == 'true' }}
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path msix -Recurse -Include *.msixbundle,*.msix |
                 Select-Object -First 1
          if (-not $pkg) { Write-Error "No .msix/.msixbundle found in artifact."; exit 1 }
          "path=$($pkg.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing package: $($pkg.FullName)"

      - name: Configure Microsoft Store CLI
        if: ${{ steps.gate.outputs.ready == 'true' }}
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Reconfigure store credentials
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: msstore reconfigure `
              --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
              --sellerId ${{ secrets.SELLER_ID }} `
              --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
              --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Publish MSIX to Microsoft Store
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: msstore publish "${{ steps.pkg.outputs.path }}" -id ${{ vars.STORE_PRODUCT_ID }}
